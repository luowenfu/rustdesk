name: Checkout with private hbb_common
description: Check out this public repo with the Actions token, then fetch the private submodule.

inputs:
  submodule-token:
    description: PAT that can read the private hbb_common repository
    required: true
  ref:
    description: Git ref to check out. Defaults to the triggering ref.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure private submodule credentials
      shell: bash
      env:
        SUBMODULE_PAT: ${{ inputs.submodule-token }}
      run: |
        git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/luowenfu/rustdesk_hbb_common".insteadOf "https://github.com/luowenfu/rustdesk_hbb_common"
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
        submodules: false
    - name: Checkout private submodule
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive
